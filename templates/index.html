<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Zayne AI - Gemini Edition</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        :root {
            --bg-color: #131314;
            --text-color: #e3e3e3;
            --user-msg-bg: #2b2b2b;
            --accent-color: #4e9cff;
        }

        body { 
            background-color: var(--bg-color); 
            color: var(--text-color); 
            font-family: 'Segoe UI', Tahoma, sans-serif; 
            margin: 0; display: flex; flex-direction: column; height: 100vh; 
        }

        .header { 
            padding: 15px 25px; display: flex; justify-content: space-between; align-items: center;
            background: #131314; position: sticky; top: 0; z-index: 100;
        }

        .logo { font-size: 20px; font-weight: 500; color: var(--accent-color); }

        #chat-area { 
            flex: 1; overflow-y: auto; padding: 20px 5% 120px 5%; 
            display: flex; flex-direction: column; gap: 30px; 
        }

        .msg-container { display: flex; gap: 15px; width: 100%; }
        .avatar { width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 14px; flex-shrink: 0; font-weight: bold; }
        .user-avatar { background: var(--accent-color); color: white; }
        .ai-avatar { background: #333; color: var(--accent-color); border: 1px solid #444; }

        .content { font-size: 16px; line-height: 1.6; max-width: 85%; word-wrap: break-word; }
        .user-content { background: var(--user-msg-bg); padding: 12px 20px; border-radius: 20px; }

        pre { background: #1e1e1e; padding: 15px; border-radius: 10px; overflow-x: auto; border: 1px solid #333; }
        code { font-family: 'Courier New', monospace; color: #00ffcc; }

        .input-wrapper {
            position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
            width: 90%; max-width: 700px;
            background: #1e1f20; border-radius: 30px;
            display: flex; align-items: center; padding: 5px 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }

        input { flex: 1; background: transparent; border: none; color: white; padding: 12px; font-size: 16px; outline: none; }
        
        .icon-btn { background: transparent; border: none; cursor: pointer; padding: 8px; font-size: 20px; transition: 0.3s; }
        #mic-btn { color: #888; }
        #mic-btn.recording { color: #ff4e4e; animation: pulse 1s infinite; }
        #send-btn { color: var(--accent-color); }

        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }
    </style>
</head>
<body>

    <div class="header">
        <div class="logo">Zayne AI</div>
        <button style="background:#2b2b2b; color:white; border:none; padding:8px 15px; border-radius:20px; cursor:pointer;" onclick="clearHistory()">New Chat</button>
    </div>

    <div id="chat-area"></div>

    <div class="input-wrapper">
        <button id="mic-btn" class="icon-btn" onclick="startVoice()">🎙️</button>
        <input type="text" id="user-input" placeholder="Type or speak here..." autocomplete="off">
        <button id="send-btn" class="icon-btn" onclick="send()">➤</button>
    </div>

    <script>
        const chatArea = document.getElementById('chat-area');
        const userInput = document.getElementById('user-input');
        const micBtn = document.getElementById('mic-btn');

        // --- Load History ---
        window.onload = () => {
            const savedChat = localStorage.getItem('zayne_v3_history');
            if (savedChat) {
                chatArea.innerHTML = savedChat;
                chatArea.scrollTop = chatArea.scrollHeight;
            }
        };

        function saveChat() {
            localStorage.setItem('zayne_v3_history', chatArea.innerHTML);
        }

        // --- Voice Recognition ---
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (SpeechRecognition) {
            const recognition = new SpeechRecognition();
            recognition.lang = 'en-US'; 

            recognition.onstart = () => { micBtn.classList.add('recording'); };
            recognition.onresult = (event) => {
                userInput.value = event.results[0][0].transcript;
                micBtn.classList.remove('recording');
            };
            recognition.onend = () => { micBtn.classList.remove('recording'); };
            window.startVoice = () => { recognition.start(); };
        }

        async function send() {
            const message = userInput.value.trim();
            if(!message) return;

            chatArea.innerHTML += `
                <div class="msg-container" style="justify-content: flex-end;">
                    <div class="content user-content">${message}</div>
                    <div class="avatar user-avatar">U</div>
                </div>`;
            
            userInput.value = "";
            chatArea.scrollTop = chatArea.scrollHeight;
            saveChat();

            try {
                const response = await fetch('/chat', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({message: message})
                });
                const data = await response.json();
                
                chatArea.innerHTML += `
                    <div class="msg-container">
                        <div class="avatar ai-avatar">Z</div>
                        <div class="content">${marked.parse(data.response)}</div>
                    </div>`;
                
                chatArea.scrollTop = chatArea.scrollHeight;
                saveChat();
            } catch(e) {
                chatArea.innerHTML += `<div style="color:red; text-align:center;">Error! Check your connection.</div>`;
            }
        }

        function clearHistory() {
            if(confirm("Delete all messages?")) {
                localStorage.removeItem('zayne_v3_history');
                chatArea.innerHTML = "";
            }
        }

        userInput.addEventListener("keypress", (e) => { if (e.key === "Enter") send(); });
    </script>
</body>
</html>
